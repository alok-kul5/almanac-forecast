[project]
name = "almanac"
version = "0.1.0"
description = "Daily demand forecasting with rolling backtests, MLflow tracking, a FastAPI service and drift checks"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools]
packages = ["almanac"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
